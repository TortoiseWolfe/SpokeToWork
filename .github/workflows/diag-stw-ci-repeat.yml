name: Diag repeat runs (throwaway, never merge)

on:
  push:
    branches: [diag/stw-ci-repeat]

concurrency:
  group: diag-stw-ci-repeat
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TEST_USER_PRIMARY_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
  TEST_USER_PRIMARY_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
  TEST_USER_SECONDARY_EMAIL: ${{ vars.TEST_USER_SECONDARY_EMAIL }}
  TEST_USER_SECONDARY_PASSWORD: ${{ secrets.TEST_USER_SECONDARY_PASSWORD }}
  TEST_USER_TERTIARY_EMAIL: ${{ vars.TEST_USER_TERTIARY_EMAIL }}
  TEST_USER_TERTIARY_PASSWORD: ${{ secrets.TEST_USER_TERTIARY_PASSWORD }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/start-local-supabase
        with:
          seed: 'false'
      - name: Build application
        run: pnpm build
        env:
          GITHUB_ACTIONS: false
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_ORS_API_KEY: ${{ secrets.NEXT_PUBLIC_ORS_API_KEY }}
      - uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: out/
          retention-days: 1

  repeat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: raw goto control x3
            project: webkit
            msg: 'yes'
            repeat: 3
            args: tests/e2e/diag-goto-raw.spec.ts
          - name: fixture goto (quiet right now) x3
            project: webkit
            msg: 'yes'
            repeat: 3
            args: tests/e2e/diag-goto-fixture.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/start-local-supabase
      - run: pnpm exec playwright install --with-deps chromium ${{ matrix.project }}
      - uses: actions/download-artifact@v5
        with:
          name: build-output
          path: out/
      - name: Start server
        run: |
          npx http-server out -p 3000 -c-1 &
          npx wait-on http://localhost:3000 --timeout 60000
      - name: Repeat the spec
        run: |
          pnpm exec playwright test \
            --project=${{ matrix.project }} \
            ${{ matrix.args }} \
            --repeat-each ${{ matrix.repeat }} \
            --retries=0 \
            --workers=1 \
            --trace=retain-on-failure \
            --reporter=list,json
        env:
          CI: true
          SKIP_WEBSERVER: true
          BASE_URL: http://localhost:3000
          DEBUG: pw:api,pw:browser
          PLAYWRIGHT_JSON_OUTPUT_NAME: diag-result.json
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          E2E_SHARD_INDEX: ${{ matrix.msg == 'yes' && '9' || '' }}
          E2E_ENCRYPTION_KEYS: ${{ matrix.msg == 'yes' && secrets.E2E_ENCRYPTION_KEYS || '' }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
      - name: Upload traces and result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: diag-${{ strategy.job-index }}
          path: |
            test-results/
            diag-result.json
          retention-days: 2
