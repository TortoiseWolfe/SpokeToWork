name: Supabase Keep-Alive

# Keeps the Supabase Cloud free-tier project awake (it auto-pauses after 7 days idle).
on:
  schedule:
    # 3:00 AM UTC every 3rd day of the month.
    # NOTE: day-of-month steps restart each month, they do not roll over.
    # The previous '*/6' fired on days 1,7,13,19,25 — leaving a 7-day gap from
    # the 25th to the 1st in any 31-day month, which is exactly the auto-pause
    # threshold. '*/3' fires 1,4,...,28, so the worst-case gap is 4 days.
    - cron: '0 3 */3 * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prime-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # pnpm MUST be installed before setup-node: setup-node@v5 defaults to
      # package-manager-cache: true, which shells out to pnpm to resolve the
      # store path. With the old order it died with "Unable to locate
      # executable file: pnpm" before ever reaching Supabase — and the
      # "Notify on failure" step below then blamed a paused instance.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prime Supabase instance
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run prime

      # Issue #85: anon holds write privileges on spatial_ref_sys. The table is
      # owned by supabase_admin, so REVOKE and ENABLE ROW LEVEL SECURITY both
      # fail from the project role (42501: must be owner) — the grant cannot be
      # closed from here. Detection is therefore the whole mitigation: if the
      # row count moves, someone has written to it.
      - name: Detect spatial_ref_sys tampering (#85)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPECTED_ROWS: '8500'
        run: |
          set -euo pipefail
          RANGE=$(curl -sS -o /dev/null -D - \
            "${SUPABASE_URL}/rest/v1/spatial_ref_sys?select=srid" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" \
            | tr -d '\r' | grep -i '^content-range:' || true)

          if [ -z "$RANGE" ]; then
            echo "No content-range returned — could not read spatial_ref_sys."
            echo "If the table is no longer exposed to anon that is an improvement,"
            echo "but confirm it deliberately rather than assuming."
            exit 1
          fi

          ACTUAL="${RANGE##*/}"
          echo "spatial_ref_sys rows: ${ACTUAL} (expected ${EXPECTED_ROWS})"

          if [ "$ACTUAL" != "$EXPECTED_ROWS" ]; then
            echo "::error::spatial_ref_sys row count changed: ${ACTUAL} vs expected ${EXPECTED_ROWS}."
            echo "Either the table was written to (see #85) or PostGIS was upgraded."
            echo "Confirm which, then update EXPECTED_ROWS if the change is legitimate."
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Supabase priming failed!"
          echo "Check WHICH step failed before assuming the instance is paused —"
          echo "a setup/toolchain failure never reaches Supabase at all."
          echo "If 'Prime Supabase instance' itself failed, then verify the"
          echo "project is active and NEXT_PUBLIC_SUPABASE_URL/ANON_KEY are correct."
          exit 1
