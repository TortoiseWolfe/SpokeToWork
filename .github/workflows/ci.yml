name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_DEPLOY_URL: ${{ vars.NEXT_PUBLIC_DEPLOY_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_PRIMARY_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
      TEST_USER_PRIMARY_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
      TEST_USER_SECONDARY_EMAIL: ${{ vars.TEST_USER_SECONDARY_EMAIL }}
      TEST_USER_SECONDARY_PASSWORD: ${{ secrets.TEST_USER_SECONDARY_PASSWORD }}
      TEST_USER_TERTIARY_EMAIL: ${{ vars.TEST_USER_TERTIARY_EMAIL }}
      TEST_USER_TERTIARY_PASSWORD: ${{ secrets.TEST_USER_TERTIARY_PASSWORD }}

    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # Only fail on high/critical - low severity elliptic has no patch available.
        # Ignored advisories (dev-server-only vite CVEs, app ships as static export):
        #   GHSA-v2wj-q39q-566r — Vite server.fs.deny bypass (dev only)
        #   GHSA-p9ff-h696-f583 — Vite arbitrary file read via dev WebSocket (dev only)
        # 2026-04-15: npm retired the old audit endpoint (410 Gone). pnpm audit
        # fails until pnpm ships a fix for the bulk advisory API. Non-blocking
        # so CI is not held hostage by npm infrastructure changes.
        continue-on-error: true
        run: pnpm audit --audit-level=high --ignore GHSA-v2wj-q39q-566r --ignore GHSA-p9ff-h696-f583

      - name: Check for SQL injection patterns
        run: |
          echo "Checking for unsafe SQL interpolation patterns in test files..."
          # Pattern: '${variable}' without escapeSQL nearby
          # This finds lines with template literal SQL that don't use escapeSQL
          # Exclusions:
          # - escapeSQL/safe* variables: properly escaped values
          # - database-setup.test.ts: uses hardcoded constant table names only
          # - global-setup.ts: uses hardcoded ADMIN_USER constants only
          # - node_modules: third-party code
          UNSAFE_PATTERNS=$(grep -rn "'\\\${" tests/ | grep -v "escapeSQL\|safeUserId\|safeEmail\|safePassword\|safeAdminId" | grep -v "database-setup.test.ts\|global-setup.ts" | grep -v "node_modules" || true)

          if [ -n "$UNSAFE_PATTERNS" ]; then
            echo "ERROR: Found potentially unsafe SQL interpolation patterns:"
            echo "$UNSAFE_PATTERNS"
            echo ""
            echo "All SQL string interpolation must use escapeSQL() or safe* variables."
            echo "See docs/specs/047-test-security for details."
            exit 1
          fi

          echo "SQL injection check passed - all interpolations use escapeSQL"

      - name: Generate project configuration
        run: node scripts/detect-project.js

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # TypeScript's unused-symbol checks do not span modules, so a *closed
      # island* — a group of files importing each other with no entry point
      # from the app — compiles cleanly and type-checks cleanly forever. One
      # (4 messaging modules, 719 LOC) survived from the initial commit to
      # 2026-08 and cost two debugging sessions plus a false root cause on #69
      # before anyone noticed. This is the only check that catches that shape.
      #
      # knip.jsonc carries a baseline of pre-existing findings (see #90) so
      # this gate is green on arrival and fails only on NEW dead files.
      - name: Detect dead code (unreferenced files)
        run: pnpm lint:dead

      # scripts/validate-breakpoints.ts asserts that the --breakpoint-* custom
      # properties in globals.css match BREAKPOINTS in src/config/breakpoints.ts,
      # and that the ranges have no gaps. It has existed since the breakpoints
      # were introduced and was invoked by no workflow, so CSS and TS could
      # drift apart silently. This is the only check that catches that.
      - name: Validate breakpoints (CSS <-> TS drift)
        run: pnpm validate:breakpoints

      - name: Run unit tests
        run: pnpm exec vitest run

      - name: Build application
        run: pnpm build

      - name: Build Storybook
        run: rm -rf storybook-static && pnpm build-storybook
