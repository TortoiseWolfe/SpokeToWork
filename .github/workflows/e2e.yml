name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # cancel-in-progress disabled: sequential browser execution takes ~45 min.
  # With cancel-in-progress, any push within that window kills the running
  # E2E mid-flight and leaves the later browser batches without a result.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job below that needs a database starts its OWN local Supabase stack
# (see .github/actions/local-supabase) from the repo's single migration file
# and seed files. Nothing here reads or writes the production Supabase
# project: the keys come from scripts/e2e-local-keys.mjs, made fresh from the
# run id, so they are worthless outside this run. (Issue 141.)

jobs:
  # ============================================
  # STEP 1: Build once, cache for all browsers
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The site is built once and every test job downloads it, so the local
      # database address and anon key are baked into it here. Every later job
      # derives the same keys from the same run id.
      - name: Make this run's local Supabase settings
        run: node scripts/e2e-local-keys.mjs

      - name: Build application
        run: pnpm build
        env:
          GITHUB_ACTIONS: false
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_ORS_API_KEY: ${{ secrets.NEXT_PUBLIC_ORS_API_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: out/
          retention-days: 1

  # ============================================
  # STEP 2: Smoke tests - FAST FEEDBACK
  # ============================================
  smoke:
    name: Smoke Tests
    # Pinned (all Playwright jobs below): ubuntu-latest became 26.04, which Playwright cannot install chromium on.
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: out/

      - name: Make this run's local Supabase settings
        run: node scripts/e2e-local-keys.mjs

      - name: Start local Supabase
        uses: ./.github/actions/local-supabase

      - name: Start server
        run: |
          npx http-server out -p 3000 -c-1 &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run smoke tests
        run: |
          pnpm exec playwright test \
            tests/e2e/auth/protected-routes.spec.ts \
            tests/e2e/auth/sign-up.spec.ts \
            --project=chromium \
            --reporter=list \
            --timeout=30000
        env:
          CI: true
          SMOKE_ONLY: 'true'
          SKIP_WEBSERVER: true
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          E2E_ENCRYPTION_KEYS: ${{ secrets.E2E_ENCRYPTION_KEYS }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_PRIMARY_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PRIMARY_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_SECONDARY_EMAIL: ${{ vars.TEST_USER_SECONDARY_EMAIL }}
          TEST_USER_SECONDARY_PASSWORD: ${{ secrets.TEST_USER_SECONDARY_PASSWORD }}
          TEST_USER_TERTIARY_EMAIL: ${{ vars.TEST_USER_TERTIARY_EMAIL }}
          TEST_USER_TERTIARY_PASSWORD: ${{ secrets.TEST_USER_TERTIARY_PASSWORD }}

      - name: Show Supabase logs after a failure
        if: failure()
        run: docker compose -p e2e logs --tail=100 supabase-auth supabase-rest supabase-kong supabase-realtime || true

      - name: Smoke test summary
        if: always()
        run: |
          echo "## 🚀 Smoke Tests Complete" >> $GITHUB_STEP_SUMMARY
          echo "Core auth and routing tests ran against a local Supabase stack started inside this job." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # STEP 3a: Chromium E2E (12 shards, runs first)
  # ============================================
  # Sequential browser execution: browsers run one after another. Each shard
  # now has a database of its own, so shards no longer contend for one shared
  # database, but the chain is kept so a pull request costs one browser's
  # worth of runners, not three.
  #
  # There is no separate auth-setup job any more: a saved login only means
  # something to the database that issued it, and every shard has its own. So
  # every shard runs the Playwright `setup` project itself (no --no-deps).
  e2e-chromium:
    name: E2E (chromium ${{ matrix.group }}${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: smoke
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: gen-, shard: 1/4 }
          - { group: gen-, shard: 2/4 }
          - { group: gen-, shard: 3/4 }
          - { group: gen-, shard: 4/4 }
          - { group: msg-, shard: 1/4 }
          - { group: msg-, shard: 2/4 }
          - { group: msg-, shard: 3/4 }
          - { group: msg-, shard: 4/4 }
          - { group: heavy-, shard: 1/4 }
          - { group: heavy-, shard: 2/4 }
          - { group: heavy-, shard: 3/4 }
          - { group: heavy-, shard: 4/4 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: out/
      - name: Make this run's local Supabase settings
        run: node scripts/e2e-local-keys.mjs
      - name: Start local Supabase
        uses: ./.github/actions/local-supabase
      - name: Start server
        run: |
          npx http-server out -p 3000 -c-1 &
          npx wait-on http://localhost:3000 --timeout 60000
      - name: Extract shard index
        id: shard-index
        env:
          MATRIX_SHARD_VAL: ${{ matrix.shard }}
        run: |
          SHARD_NUM=$(echo "$MATRIX_SHARD_VAL" | cut -d/ -f1)
          echo "index=$SHARD_NUM" >> "$GITHUB_OUTPUT"
      - name: Run E2E tests (chromium ${{ matrix.group }}${{ matrix.shard }})
        run: |
          HEAVY_PATTERN="complete-flows|new-user-complete-flow|welcome-message|resume-upload"
          if [ "$E2E_GROUP" = "msg-" ]; then
            GREP_FLAG="--grep=messaging/|employer/"
          elif [ "$E2E_GROUP" = "heavy-" ]; then
            GREP_FLAG="--grep=$HEAVY_PATTERN"
          else
            GREP_FLAG="--grep-invert=messaging/|employer/|$HEAVY_PATTERN"
          fi
          # The setup project (auth.setup.ts) runs first in every shard: it
          # signs the test users in on this job's own database. For the msg
          # shards it also injects the pre-baked encryption keys for the
          # shard users (e2e-s{N}-*); without them the browser would fall back
          # to Argon2id key derivation, which times out on CI.
          pnpm exec playwright test \
            --project=chromium \
            --shard=${{ matrix.shard }} \
            $GREP_FLAG \
            --reporter=blob \
            --trace=on-first-retry
        env:
          E2E_GROUP: ${{ matrix.group }}
          CI: true
          SKIP_WEBSERVER: true
          BASE_URL: http://localhost:3000
          DEBUG: pw:api
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          E2E_SHARD_INDEX: ${{ matrix.group == 'msg-' && steps.shard-index.outputs.index || '' }}
          E2E_ENCRYPTION_KEYS: ${{ secrets.E2E_ENCRYPTION_KEYS }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_PRIMARY_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PRIMARY_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_SECONDARY_EMAIL: ${{ vars.TEST_USER_SECONDARY_EMAIL }}
          TEST_USER_SECONDARY_PASSWORD: ${{ secrets.TEST_USER_SECONDARY_PASSWORD }}
          TEST_USER_TERTIARY_EMAIL: ${{ vars.TEST_USER_TERTIARY_EMAIL }}
          TEST_USER_TERTIARY_PASSWORD: ${{ secrets.TEST_USER_TERTIARY_PASSWORD }}
      - name: Show Supabase logs after a failure
        if: failure()
        run: docker compose -p e2e logs --tail=100 supabase-auth supabase-rest supabase-kong supabase-realtime || true
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-chromium-${{ matrix.group }}${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1

  # ============================================
  # STEP 3b: Firefox E2E (waits for chromium)
  # ============================================
  e2e-firefox:
    name: E2E (firefox ${{ matrix.group }}${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: e2e-chromium
    if: always() && !cancelled() && github.event_name != 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: gen-, shard: 1/4 }
          - { group: gen-, shard: 2/4 }
          - { group: gen-, shard: 3/4 }
          - { group: gen-, shard: 4/4 }
          - { group: msg-, shard: 1/4 }
          - { group: msg-, shard: 2/4 }
          - { group: msg-, shard: 3/4 }
          - { group: msg-, shard: 4/4 }
          - { group: heavy-, shard: 1/4 }
          - { group: heavy-, shard: 2/4 }
          - { group: heavy-, shard: 3/4 }
          - { group: heavy-, shard: 4/4 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: |
          pnpm exec playwright install --with-deps firefox
          # The setup project (auth.setup.ts) runs in every shard and uses chromium.
          pnpm exec playwright install --with-deps chromium
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: out/
      - name: Make this run's local Supabase settings
        run: node scripts/e2e-local-keys.mjs
      - name: Start local Supabase
        uses: ./.github/actions/local-supabase
      - name: Start server
        run: |
          npx http-server out -p 3000 -c-1 &
          npx wait-on http://localhost:3000 --timeout 60000
      - name: Extract shard index
        id: shard-index
        env:
          MATRIX_SHARD_VAL: ${{ matrix.shard }}
        run: |
          SHARD_NUM=$(echo "$MATRIX_SHARD_VAL" | cut -d/ -f1)
          INDEX=$((SHARD_NUM + 4))
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
      - name: Run E2E tests (firefox ${{ matrix.group }}${{ matrix.shard }})
        run: |
          HEAVY_PATTERN="complete-flows|new-user-complete-flow|welcome-message|resume-upload"
          if [ "$E2E_GROUP" = "msg-" ]; then
            GREP_FLAG="--grep=messaging/|employer/"
          elif [ "$E2E_GROUP" = "heavy-" ]; then
            GREP_FLAG="--grep=$HEAVY_PATTERN"
          else
            GREP_FLAG="--grep-invert=messaging/|employer/|$HEAVY_PATTERN"
          fi
          pnpm exec playwright test \
            --project=firefox \
            --shard=${{ matrix.shard }} \
            $GREP_FLAG \
            --reporter=blob \
            --trace=on-first-retry
        env:
          E2E_GROUP: ${{ matrix.group }}
          CI: true
          SKIP_WEBSERVER: true
          BASE_URL: http://localhost:3000
          DEBUG: pw:api
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          E2E_SHARD_INDEX: ${{ matrix.group == 'msg-' && steps.shard-index.outputs.index || '' }}
          E2E_ENCRYPTION_KEYS: ${{ secrets.E2E_ENCRYPTION_KEYS }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_PRIMARY_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PRIMARY_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_SECONDARY_EMAIL: ${{ vars.TEST_USER_SECONDARY_EMAIL }}
          TEST_USER_SECONDARY_PASSWORD: ${{ secrets.TEST_USER_SECONDARY_PASSWORD }}
          TEST_USER_TERTIARY_EMAIL: ${{ vars.TEST_USER_TERTIARY_EMAIL }}
          TEST_USER_TERTIARY_PASSWORD: ${{ secrets.TEST_USER_TERTIARY_PASSWORD }}
      - name: Show Supabase logs after a failure
        if: failure()
        run: docker compose -p e2e logs --tail=100 supabase-auth supabase-rest supabase-kong supabase-realtime || true
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-firefox-${{ matrix.group }}${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1

  # ============================================
  # STEP 3c: WebKit E2E (waits for firefox)
  # ============================================
  e2e-webkit:
    name: E2E (webkit ${{ matrix.group }}${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: e2e-firefox
    if: always() && !cancelled() && github.event_name != 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: gen-, shard: 1/4 }
          - { group: gen-, shard: 2/4 }
          - { group: gen-, shard: 3/4 }
          - { group: gen-, shard: 4/4 }
          - { group: msg-, shard: 1/4 }
          - { group: msg-, shard: 2/4 }
          - { group: msg-, shard: 3/4 }
          - { group: msg-, shard: 4/4 }
          - { group: heavy-, shard: 1/4 }
          - { group: heavy-, shard: 2/4 }
          - { group: heavy-, shard: 3/4 }
          - { group: heavy-, shard: 4/4 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: |
          pnpm exec playwright install --with-deps webkit
          # The setup project (auth.setup.ts) runs in every shard and uses chromium.
          pnpm exec playwright install --with-deps chromium
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: out/
      - name: Make this run's local Supabase settings
        run: node scripts/e2e-local-keys.mjs
      - name: Start local Supabase
        uses: ./.github/actions/local-supabase
      - name: Start server
        run: |
          npx http-server out -p 3000 -c-1 &
          npx wait-on http://localhost:3000 --timeout 60000
      - name: Extract shard index
        id: shard-index
        env:
          MATRIX_SHARD_VAL: ${{ matrix.shard }}
        run: |
          SHARD_NUM=$(echo "$MATRIX_SHARD_VAL" | cut -d/ -f1)
          INDEX=$((SHARD_NUM + 8))
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
      - name: Run E2E tests (webkit ${{ matrix.group }}${{ matrix.shard }})
        run: |
          HEAVY_PATTERN="complete-flows|new-user-complete-flow|welcome-message|resume-upload"
          if [ "$E2E_GROUP" = "msg-" ]; then
            GREP_FLAG="--grep=messaging/|employer/"
          elif [ "$E2E_GROUP" = "heavy-" ]; then
            GREP_FLAG="--grep=$HEAVY_PATTERN"
          else
            GREP_FLAG="--grep-invert=messaging/|employer/|$HEAVY_PATTERN"
          fi
          pnpm exec playwright test \
            --project=webkit \
            --shard=${{ matrix.shard }} \
            $GREP_FLAG \
            --reporter=blob \
            --trace=on-first-retry
        env:
          E2E_GROUP: ${{ matrix.group }}
          CI: true
          SKIP_WEBSERVER: true
          BASE_URL: http://localhost:3000
          DEBUG: pw:api
          NEXT_PUBLIC_E2E_TEST_MODE: 'true'
          E2E_SHARD_INDEX: ${{ matrix.group == 'msg-' && steps.shard-index.outputs.index || '' }}
          E2E_ENCRYPTION_KEYS: ${{ secrets.E2E_ENCRYPTION_KEYS }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_PRIMARY_EMAIL: ${{ vars.TEST_USER_PRIMARY_EMAIL }}
          TEST_USER_PRIMARY_PASSWORD: ${{ secrets.TEST_USER_PRIMARY_PASSWORD }}
          TEST_USER_SECONDARY_EMAIL: ${{ vars.TEST_USER_SECONDARY_EMAIL }}
          TEST_USER_SECONDARY_PASSWORD: ${{ secrets.TEST_USER_SECONDARY_PASSWORD }}
          TEST_USER_TERTIARY_EMAIL: ${{ vars.TEST_USER_TERTIARY_EMAIL }}
          TEST_USER_TERTIARY_PASSWORD: ${{ secrets.TEST_USER_TERTIARY_PASSWORD }}
      - name: Show Supabase logs after a failure
        if: failure()
        run: docker compose -p e2e logs --tail=100 supabase-auth supabase-rest supabase-kong supabase-realtime || true
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-webkit-${{ matrix.group }}${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1

  # ============================================
  # STEP 4: Merge reports and generate summary
  # ============================================
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [e2e-chromium, e2e-firefox, e2e-webkit]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        run: |
          pnpm exec playwright merge-reports --reporter=html,github ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Generate summary
        if: always()
        run: |
          echo "## 📊 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "**PR Mode**: Chromium only (12 shards)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Full Mode**: Chromium -> Firefox -> WebKit (36 shards, sequential browsers)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Every shard ran against its own local Supabase stack." >> $GITHUB_STEP_SUMMARY
          echo "📁 Download the **playwright-report** artifact for detailed results." >> $GITHUB_STEP_SUMMARY
