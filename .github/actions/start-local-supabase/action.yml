name: Start local Supabase
description: Start a throwaway Supabase stack, export its URL/keys, and seed E2E users.

inputs:
  seed:
    description: Seed the admin and test users after the stack starts.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The stack's host ports (54320-54329) fall inside the range Linux also
    # hands out as the local end of outgoing connections (image pulls, package
    # downloads). One of them was held for the whole start-up on a shared
    # runner, so all three tries failed with "address already in use" on 54322
    # before any test ran. Telling the kernel never to give these ports to
    # outgoing connections removes the cause; it must happen before any
    # download starts.
    - name: Keep Supabase's host ports out of the outgoing-connection range
      shell: bash
      run: |
        set -euo pipefail
        sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
        sysctl net.ipv4.ip_local_reserved_ports

    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        # Pinned so the build job and every shard derive identical local keys.
        version: 3.0.0

    # Studio, analytics and the connection pooler are not used by the tests.
    # Leaving them out keeps startup fast on fresh runners. Mail capture
    # (sign-up confirmation) and the Edge Functions runtime (delete-user-account,
    # used by the GDPR specs) stay on.
    - name: Start Supabase
      shell: bash
      run: |
        set -uo pipefail
        # The stack's host ports (54321-54329) sit inside the range the
        # operating system also hands to outgoing connections, so on a busy
        # shared runner one can be taken a moment before Docker binds it
        # ("address already in use"). Tear down the half-started stack and
        # try again; a real failure still fails the job after the last try.
        attempts=3
        for attempt in $(seq 1 "${attempts}"); do
          if supabase start \
            -x studio,imgproxy,logflare,vector,postgres-meta,supavisor \
            > "${RUNNER_TEMP}/supabase-start.log" 2>&1; then
            exit 0
          fi
          # Keep the diagnostic output, but never echo credentials.
          echo "::warning::supabase start failed (attempt ${attempt} of ${attempts})"
          grep -viE 'anon key|service_role key|publishable key|secret key|jwt secret|password' \
            "${RUNNER_TEMP}/supabase-start.log" | tail -40 || true
          # Show what holds the stack's host ports (addresses and states only).
          ss -tan 2>/dev/null | grep -E ':543(2[0-9])\b' || true
          supabase stop --no-backup > /dev/null 2>&1 || true
          sleep 5
        done
        exit 1

    # Export the local stack's values into this job. Nothing is printed: the
    # CLI's status output contains JWTs, and workflow logs are public.
    - name: Export local Supabase environment
      shell: bash
      run: |
        set -euo pipefail
        eval "$(supabase status -o env)"

        ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
        SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"

        if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY}" ]; then
          echo "::error::Could not read the local Supabase API URL / anon key"
          exit 1
        fi
        if [ -z "${DB_URL:-}" ]; then
          echo "::error::Could not read the local Supabase database URL"
          exit 1
        fi

        # The admin account exists only inside this throwaway stack, so its
        # sign-in password is a fresh random value per job. The admin E2E specs
        # read it from TEST_USER_ADMIN_PASSWORD; the seed step sets it.
        ADMIN_PASSWORD="$(openssl rand -hex 16)"
        echo "::add-mask::${ADMIN_PASSWORD}"

        {
          echo "TEST_USER_ADMIN_PASSWORD=${ADMIN_PASSWORD}"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          echo "SUPABASE_DB_URL=${DB_URL}"
        } >> "${GITHUB_ENV}"

    - name: Seed test users
      if: ${{ inputs.seed != 'false' }}
      shell: bash
      run: pnpm exec tsx scripts/seed-test-users.ts
